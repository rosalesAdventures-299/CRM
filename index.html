<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rosale's Adventures | Sales OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B1F3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rosale's CRM">
<style>
:root{
  --navy-950:#081527;
  --navy-900:#0B1F3A;
  --navy-800:#132A4D;
  --navy-700:#1E3A5F;
  --navy-600:#2C4D78;
  --gold-400:#E8CB7A;
  --gold-500:#D4B45C;
  --gold-600:#C9A94E;
  --gold-700:#A9862F;
  --white:#FFFFFF;
  --bg:#F4F5F8;
  --bg-card:#FFFFFF;
  --text-dark:#12203A;
  --text-muted:#6B7688;
  --text-soft:#98A2B3;
  --line:#E7E9F0;
  --red:#DC2626; --red-bg:#FDEAEA; --red-txt:#B91C1C;
  --orange:#EA580C; --orange-bg:#FDEEE3; --orange-txt:#C2410C;
  --yellow:#CA8A04; --yellow-bg:#FCF3D6; --yellow-txt:#946608;
  --green:#16A34A; --green-bg:#E4F7EA; --green-txt:#0E7C37;
  --blue:#2563EB; --blue-bg:#E9EFFD; --blue-txt:#1D4ED8;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(11,31,58,.04), 0 6px 20px rgba(11,31,58,.06);
  --shadow-pop:0 10px 40px rgba(8,21,39,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text-dark);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.brandfont{font-family:'Playfair Display',serif;}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#D3D8E4;border-radius:10px;}

.app-shell{min-height:100vh;padding-bottom:78px;}

.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  color:#fff;padding:14px 14px 14px 10px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 16px rgba(8,21,39,.18);
  border-bottom:2px solid var(--gold-600);
}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  width:38px;height:38px;border-radius:11px;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;position:relative;
}
.icon-btn:active{transform:scale(.94);}
.topbar-titles{flex:1;min-width:0;}
.topbar-title{font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:var(--gold-400);font-weight:600;letter-spacing:.5px;}
.badge-dot{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;
  background:var(--red);border-radius:20px;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--navy-900);
}

.drawer-overlay{
  position:fixed;inset:0;background:rgba(8,15,28,.55);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:280px;z-index:61;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  transform:translateX(-100%);transition:transform .25s ease;
  display:flex;flex-direction:column;color:#fff;
}
.sidebar.open{transform:translateX(0);}
.brand-row{display:flex;align-items:center;gap:12px;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-logo{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-700));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--navy-950);font-size:15px;
}
.brand-text{flex:1;min-width:0;}
.brand-name{display:block;font-weight:700;font-size:15px;line-height:1.25;}
.brand-sub{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--gold-400);font-weight:600;}
.drawer-close{background:transparent;border:none;color:#fff;font-size:18px;opacity:.7;width:30px;height:30px;}
.nav-list{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;
  color:rgba(255,255,255,.78);font-weight:500;font-size:14.5px;margin-bottom:2px;
  border:1px solid transparent;background:transparent;width:100%;text-align:left;
}
.nav-item .ico{width:22px;text-align:center;font-size:16px;}
.nav-item.active{background:rgba(212,180,92,.14);color:#fff;border-color:rgba(212,180,92,.35);}
.nav-item.active .ico{filter:none;}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.btn-settings{
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#fff;padding:11px;border-radius:11px;font-weight:500;font-size:14px;text-align:left;
}

.main{padding:16px 14px 24px;max-width:1180px;margin:0 auto;}
.view-head{margin-bottom:16px;}
.view-head h1{font-size:20px;font-weight:700;margin:0 0 2px;color:var(--navy-900);}
.view-head p{font-size:13px;color:var(--text-muted);margin:0;}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:39;height:70px;
  background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  display:flex;align-items:stretch;border-top:2px solid var(--gold-600);
  box-shadow:0 -6px 20px rgba(8,21,39,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:transparent;border:none;color:rgba(255,255,255,.62);font-size:10.5px;font-weight:600;
}
.bn-item .ico{font-size:19px;}
.bn-item.active{color:var(--gold-400);}
.bn-item.active .ico{transform:translateY(-1px);}

.card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;border:1px solid var(--line);}
.section-title{font-size:14px;font-weight:700;color:var(--navy-900);margin:22px 0 10px;display:flex;align-items:center;gap:6px;}
.section-title:first-child{margin-top:0;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi-card{
  background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--line);
  padding:13px 14px;box-shadow:var(--shadow-card);
}
.kpi-label{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.kpi-value{font-size:19px;font-weight:700;color:var(--navy-900);line-height:1.15;}
.kpi-sub{font-size:11px;color:var(--text-soft);margin-top:3px;}

.goal-card{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  border-radius:var(--radius-lg);padding:18px;color:#fff;box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.goal-card::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(212,180,92,.25),transparent 70%);}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.goal-label{font-size:12px;letter-spacing:.5px;color:var(--gold-400);font-weight:700;text-transform:uppercase;}
.goal-pct{font-size:22px;font-weight:800;color:var(--gold-400);}
.goal-nums{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;color:rgba(255,255,255,.85);}
.goal-nums b{color:#fff;font-size:17px;}
.progress-track{height:10px;background:rgba(255,255,255,.14);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-600),var(--gold-400));border-radius:20px;transition:width .4s ease;}

.hot-card{
  border-radius:var(--radius-lg);border:1px solid #F3D9A8;background:linear-gradient(180deg,#FFF9EE,#FFFFFF);
  padding:14px;box-shadow:var(--shadow-card);
}
.hot-title{font-size:15px;font-weight:800;color:var(--navy-900);margin-bottom:2px;}
.hot-sub{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
.hot-row{
  display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;background:#fff;
  border:1px solid var(--line);margin-bottom:8px;
}
.hot-row:last-child{margin-bottom:0;}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;background:var(--navy-700);
}
.hot-info{flex:1;min-width:0;}
.hot-name{font-size:13.5px;font-weight:700;color:var(--navy-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hot-meta{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hot-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-round{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;}
.icon-round.wa{background:#DCFCE7;color:#16A34A;}
.icon-round.view{background:var(--navy-900);color:#fff;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-red{background:var(--red-bg);color:var(--red-txt);}
.b-orange{background:var(--orange-bg);color:var(--orange-txt);}
.b-yellow{background:var(--yellow-bg);color:var(--yellow-txt);}
.b-green{background:var(--green-bg);color:var(--green-txt);}
.b-blue{background:var(--blue-bg);color:var(--blue-txt);}
.b-navy{background:var(--navy-900);color:#fff;}
.b-gold{background:#FBF1DA;color:var(--gold-700);}
.b-gray{background:#EEF0F4;color:var(--text-muted);}

.btn{border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-700));color:var(--navy-950);font-weight:700;}
.btn-navy{background:var(--navy-900);color:#fff;}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--navy-900);}
.btn-danger{background:var(--red-bg);color:var(--red-txt);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px;}
.btn:active{transform:scale(.97);}

.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px;}
.searchbar input{border:none;outline:none;flex:1;background:transparent;font-size:14px;}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.chip.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

.client-row{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:9px;box-shadow:var(--shadow-card);
}
.client-info{flex:1;min-width:0;}
.client-name{font-size:14px;font-weight:700;color:var(--navy-900);}
.client-meta{font-size:12px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-right{text-align:right;flex-shrink:0;}
.client-value{font-size:13px;font-weight:700;color:var(--navy-900);}
.client-dot-row{display:flex;align-items:center;gap:5px;margin-top:5px;justify-content:flex-end;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot-red{background:var(--red);}.dot-orange{background:var(--orange);}.dot-yellow{background:var(--yellow);}.dot-green{background:var(--green);}.dot-gray{background:#C7CCD6;}

.fab{
  position:fixed;right:18px;bottom:90px;z-index:38;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-700));color:var(--navy-950);
  border:none;font-size:24px;box-shadow:0 10px 24px rgba(201,169,78,.45);display:flex;align-items:center;justify-content:center;
}

.kanban-wrap{overflow-x:auto;padding-bottom:10px;margin:0 -14px;padding-left:14px;padding-right:14px;}
.kanban-track{display:flex;gap:12px;}
.kanban-col{flex-shrink:0;width:250px;background:#EEF1F6;border-radius:16px;padding:10px;}
.kanban-head{padding:6px 6px 10px;}
.kanban-head-name{font-size:12.5px;font-weight:800;color:var(--navy-900);}
.kanban-head-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.kanban-card{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.kanban-card-name{font-size:12.5px;font-weight:700;color:var(--navy-900);margin-bottom:2px;}
.kanban-card-dest{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.kanban-card-foot{display:flex;justify-content:space-between;align-items:center;}
.kanban-card-val{font-size:11.5px;font-weight:700;color:var(--gold-700);}
.kanban-move{display:flex;gap:4px;}
.kmv-btn{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--navy-900);}

.seg-group{margin-bottom:18px;}
.seg-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:9px;padding:8px 12px;border-radius:12px;}
.seg-head.red{background:var(--red-bg);color:var(--red-txt);}
.seg-head.orange{background:var(--orange-bg);color:var(--orange-txt);}
.seg-head.yellow{background:var(--yellow-bg);color:var(--yellow-txt);}
.seg-head.green{background:var(--green-bg);color:var(--green-txt);}
.seg-count{margin-left:auto;background:rgba(0,0,0,.08);border-radius:20px;padding:1px 9px;font-size:11.5px;}

.progress-mini{height:7px;background:#EDEFF4;border-radius:20px;overflow:hidden;margin-top:6px;}
.progress-mini-fill{height:100%;background:linear-gradient(90deg,var(--navy-700),var(--navy-900));border-radius:20px;}

.modal-overlay{position:fixed;inset:0;background:rgba(8,15,28,.6);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.modal-card{
  background:#fff;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-pop);animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media(min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-card{border-radius:22px;margin:20px;}
}
.modal-head{
  position:sticky;top:0;background:linear-gradient(135deg,var(--navy-900),var(--navy-800));color:#fff;
  padding:16px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold-600);z-index:2;
}
.modal-head h2{font-size:16px;font-weight:700;margin:0;flex:1;}
.modal-body{padding:16px;}
.form-group{margin-bottom:13px;}
.form-label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:block;}
.form-control{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;background:#F8F9FB;outline:none;}
.form-control:focus{border-color:var(--gold-600);background:#fff;}
.form-control.err{border-color:var(--red);background:var(--red-bg);}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-hint{font-size:11px;color:var(--text-soft);margin-top:4px;}
.form-hint.err{color:var(--red-txt);font-weight:600;}

.toast-root{position:fixed;left:0;right:0;bottom:86px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{background:var(--navy-950);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.insight-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:14px;}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #EEF0F4;border-top-color:var(--gold-600);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.rec-card{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;background:#FAFBFD;}
.rec-num{width:24px;height:24px;border-radius:50%;background:var(--navy-900);color:var(--gold-400);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rec-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.rec-title{font-size:13.5px;font-weight:700;color:var(--navy-900);}
.rec-detail{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-left:33px;}
.insight-stat{background:#F8F9FB;border-radius:12px;padding:10px;text-align:center;}
.insight-stat b{display:block;font-size:16px;color:var(--navy-900);}
.insight-stat span{font-size:10.5px;color:var(--text-muted);}

.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.bar-label{width:110px;flex-shrink:0;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:16px;background:#EEF0F4;border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--navy-700),var(--navy-900));border-radius:8px;}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold-600),var(--gold-400));}
.bar-val{width:70px;flex-shrink:0;text-align:right;font-size:11.5px;font-weight:700;color:var(--navy-900);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state .emo{font-size:36px;margin-bottom:8px;}

.notes-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:160px;overflow-y:auto;}
.note-item{background:#F8F9FB;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--text-dark);}
.note-date{font-size:10.5px;color:var(--text-soft);margin-bottom:2px;font-weight:600;}

@media(min-width:992px){
  .app-shell{padding-bottom:0;}
  .bottom-nav{display:none;}
  .drawer-overlay{display:none;}
  .sidebar{transform:translateX(0);position:fixed;box-shadow:4px 0 24px rgba(8,21,39,.08);}
  .main{margin-left:280px;padding:26px 32px;max-width:1400px;}
  .topbar{margin-left:280px;padding-left:22px;}
  .drawer-close{display:none;}
  .kpi-grid{grid-template-columns:repeat(5,1fr);}
  .fab{right:36px;bottom:36px;}
}
@media(min-width:600px) and (max-width:991px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="sidebar" id="sidebar">
  <div class="brand-row">
    <div class="brand-logo brandfont">RA</div>
    <div class="brand-text">
      <span class="brand-name brandfont">Rosale's Adventures</span>
      <span class="brand-sub">SALES OS</span>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">&#10005;</button>
  </div>
  <nav class="nav-list" id="navList"></nav>
  <div class="sidebar-footer">
    <button class="btn-settings" onclick="openSettings()">&#9881;&#65039; Ajustes de meta</button>
  </div>
</aside>

function pad2(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayDate(){var d=new Date();d.setHours(0,0,0,0);return d;}
function parseISO(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function rel(n){return toISO(addDays(todayDate(),n));}
function daysDiff(a,b){return Math.round((a-b)/86400000);}
function fmtMoney(n){if(n==null||isNaN(n))return '$0';return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Math.round(n));}

var STORAGE_KEY='rosalesAdventuresSalesOS_v2';
function loadSaved(){
 try{
  var raw=localStorage.getItem(STORAGE_KEY);
  if(raw){var d=JSON.parse(raw);if(d&&d.clientes)return d;}
 }catch(e){}
 return null;
}
var SAVED=loadSaved();

var state={
 view:'dashboard',
 meta:(SAVED&&SAVED.meta)?SAVED.meta:50000,
 clientes:(SAVED&&SAVED.clientes)?SAVED.clientes:[],
 filtroCRM:{q:'',etapa:'todas'},
 filtroCot:'todas'
};
function saveState(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({clientes:state.clientes,meta:state.meta}));}catch(e){}
}
if(!SAVED)saveState();

function activos(){return state.clientes.filter(function(c){return !c.perdido;});}
function urgencia(c){
 if(TERMINAL_STAGES.indexOf(c.etapa)!==-1||c.perdido)return 'none';
 if(!c.proximoSeguimiento)return 'sinfecha';
 var d=daysDiff(parseISO(c.proximoSeguimiento),todayDate());
 if(d<0)return 'vencido';
 if(d===0)return 'hoy';
 if(d<=5)return 'proximo';
 return 'futuro';
}
function esListoParaCerrar(c){
 return !c.perdido && (c.etapa==='Negociación'||c.etapa==='Apartado') && urgencia(c)!=='vencido';
}
function clienteValor(c){return c.valorVenta||c.valorCotizado||c.presupuesto||0;}

function kpis(){
 var C=activos();
 var now=todayDate();
 var won=C.filter(function(c){return WON_STAGES.indexOf(c.etapa)!==-1;});
 var ventasMes=won.filter(function(c){
  if(!c.fechaApartado)return false;
  var d=parseISO(c.fechaApartado);
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
 });
 var ventasActuales=ventasMes.reduce(function(s,c){return s+(c.valorVenta||0);},0);
 var leadsNuevos=C.filter(function(c){return c.etapa==='Nuevo lead';}).length;
 var cotizacionesEnviadas=C.filter(function(c){return c.valorCotizado!=null;}).length;
 var reservasCerradas=won.length;
 var conversion=C.length? (reservasCerradas/C.length*100):0;
 var ticketProm=won.length? (won.reduce(function(s,c){return s+(c.valorVenta||0);},0)/won.length):0;
 var utilidadEstimada=won.reduce(function(s,c){return s+((c.valorVenta||0)*(c.utilidadPct||0));},0);
 var pendienteCobrar=C.filter(function(c){return c.etapa==='Apartado'||c.etapa==='Reserva confirmada';})
   .reduce(function(s,c){return s+Math.max(0,(c.valorVenta||0)-(c.anticipoPagado||0));},0);
 var segHoy=C.filter(function(c){return urgencia(c)==='hoy';}).length;
 var pct=state.meta? Math.min(100,Math.round(ventasActuales/state.meta*100)):0;
 return {ventasActuales:ventasActuales,leadsNuevos:leadsNuevos,cotizacionesEnviadas:cotizacionesEnviadas,
  reservasCerradas:reservasCerradas,conversion:conversion,ticketProm:ticketProm,utilidadEstimada:utilidadEstimada,
  pendienteCobrar:pendienteCobrar,segHoy:segHoy,pct:pct};
}

function alertCount(){
 return activos().filter(function(c){var u=urgencia(c);return u==='vencido'||u==='hoy'||u==='sinfecha';}).length;
}

function priorityScore(c){
 var u=urgencia(c);var score=0;
 if(u==='vencido')score+=100+Math.min(30,Math.abs(daysDiff(parseISO(c.proximoSeguimiento),todayDate())));
 if(u==='sinfecha')score+=90;
 if(u==='hoy')score+=70;
 if(esListoParaCerrar(c))score+=50;
 if(u==='proximo')score+=20;
 score+=Math.min(20,(clienteValor(c)||0)/5000);
 return score;
}
function urgTag(c){
 var u=urgencia(c);
 if(u==='vencido')return {cls:'b-red',dot:'dot-red',label:'Vencido'};
 if(u==='sinfecha')return {cls:'b-red',dot:'dot-red',label:'Sin fecha'};
 if(u==='hoy')return {cls:'b-orange',dot:'dot-orange',label:'Hoy'};
 if(u==='proximo')return {cls:'b-yellow',dot:'dot-yellow',label:'Próximo'};
 if(esListoParaCerrar(c))return {cls:'b-green',dot:'dot-green',label:'Listo p/cerrar'};
 return {cls:'b-gray',dot:'dot-gray',label:'Al día'};
}

function saveClient(){
 var body=document.getElementById('clientModalBody');
 var id=body.getAttribute('data-id');
 var isNew=body.getAttribute('data-new')==='1';
 var perdido=body.getAttribute('data-perdido')==='1';
 var etapa=document.getElementById('f_etapa').value;
 var nombre=document.getElementById('f_nombre').value.trim();
 var seg=document.getElementById('f_proximoSeguimiento').value;
 var requiresSeg=TERMINAL_STAGES.indexOf(etapa)===-1&&!perdido;
 if(!nombre){toast('Falta el nombre del cliente','&#9888;');document.getElementById('f_nombre').classList.add('err');return;}
 if(requiresSeg&&!seg){
  document.getElementById('f_proximoSeguimiento').classList.add('err');
  document.getElementById('segHint').classList.add('err');
  document.getElementById('segHint').textContent='Debes definir la próxima fecha de seguimiento antes de guardar.';
  toast('Falta la próxima fecha de seguimiento','&#9888;');
  return;
 }
 var data={
  nombre:nombre,
  whatsapp:document.getElementById('f_whatsapp').value.trim(),
  ciudad:document.getElementById('f_ciudad').value.trim(),
  fuente:document.getElementById('f_fuente').value.trim(),
  tipoViaje:document.getElementById('f_tipo').value,
  destino:document.getElementById('f_destino').value.trim(),
  hotel:document.getElementById('f_hotel').value.trim(),
  fechaInicio:document.getElementById('f_fechaInicio').value||null,
  fechaFin:document.getElementById('f_fechaFin').value||null,
  adultos:parseInt(document.getElementById('f_adultos').value,10)||1,
  menores:strToMenores(document.getElementById('f_menores').value),
  presupuesto:parseFloat(document.getElementById('f_presupuesto').value)||null,
  valorCotizado:parseFloat(document.getElementById('f_valorCotizado').value)||null,
  valorVenta:parseFloat(document.getElementById('f_valorVenta').value)||null,
  anticipoPagado:parseFloat(document.getElementById('f_anticipoPagado').value)||0,
  etapa:etapa,
  ultimoContacto:document.getElementById('f_ultimoContacto').value||null,
  proximoSeguimiento:seg||null
 };
 var notaNueva=document.getElementById('f_notaNueva').value.trim();
 if(isNew){
  var nc=blankClient();
  Object.assign(nc,data);
  nc.id=uid();
  nc.perdido=false;
  nc.creadoEn=rel(0);
  if(WON_STAGES.indexOf(nc.etapa)!==-1&&!nc.fechaApartado)nc.fechaApartado=rel(0);
  if(notaNueva)nc.notas.push({fecha:rel(0),texto:notaNueva});
  state.clientes.push(nc);
  toast('Cliente creado','&#9989;');
  saveState();
 }else{
  var c=findClient(id);
  var wasWon=WON_STAGES.indexOf(c.etapa)!==-1;
  Object.assign(c,data);
  if(WON_STAGES.indexOf(c.etapa)!==-1&&!wasWon&&!c.fechaApartado)c.fechaApartado=rel(0);
  if(notaNueva)c.notas.push({fecha:rel(0),texto:notaNueva});
  toast('Cliente actualizado','&#9989;');
  saveState();
 }
 closeModal();renderApp();
}

function markContactedToday(id){
 var c=findClient(id);if(!c)return;
 c.ultimoContacto=rel(0);
 saveState();
 toast('Marcado como contactado hoy','&#128242;');
 openClientModal(id);
}
function advanceStage(id){
 var c=findClient(id);if(!c)return;
 var idx=stageIndex(c.etapa);
 if(idx<STAGES.length-1){c.etapa=STAGES[idx+1].key;}
 if(WON_STAGES.indexOf(c.etapa)!==-1&&!c.fechaApartado)c.fechaApartado=rel(0);
 saveState();
 toast('Cliente movido a '+c.etapa,'&#10132;');
 openClientModal(id);
}
function moveStageDelta(id,delta){
 var c=findClient(id);if(!c)return;
 var idx=stageIndex(c.etapa)+delta;
 if(idx<0||idx>=STAGES.length)return;
 c.etapa=STAGES[idx].key;
 if(WON_STAGES.indexOf(c.etapa)!==-1&&!c.fechaApartado)c.fechaApartado=rel(0);
 saveState();
 renderApp();
 toast(c.nombre+' &rarr; '+c.etapa);
}
function togglePerdido(id){
 var c=findClient(id);if(!c)return;
 c.perdido=!c.perdido;
 saveState();

function renderReportes(){
 var C=activos();
 var won=C.filter(function(c){return WON_STAGES.indexOf(c.etapa)!==-1;});
 var now=todayDate();
 var meses=[];
 for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);meses.push({y:d.getFullYear(),m:d.getMonth(),label:monthLabel(d.getFullYear(),d.getMonth())});}
 var ventasPorMes=meses.map(function(mm){
  var total=won.filter(function(c){if(!c.fechaApartado)return false;var d=parseISO(c.fechaApartado);return d.getFullYear()===mm.y&&d.getMonth()===mm.m;})
   .reduce(function(s,c){return s+(c.valorVenta||0);},0);
  return {k:mm.label,v:total,fmt:fmtMoney(total)};
 });
 function groupTop(list,keyFn,valFn,n){
  var g={};
  list.forEach(function(c){var k=keyFn(c);if(!k)return;g[k]=(g[k]||0)+valFn(c);});
  return Object.keys(g).map(function(k){return {k:k,v:g[k]};}).sort(function(a,b){return b.v-a.v;}).slice(0,n||6);
 }
 var porDestino=groupTop(won,function(c){return c.destino;},function(c){return c.valorVenta||0;}).map(function(r){return {k:r.k,v:r.v,fmt:fmtMoney(r.v)};});
 var porFuente=groupTop(C,function(c){return c.fuente;},function(){return 1;}).map(function(r){return {k:r.k,v:r.v,fmt:r.v};});
 var porHotel=groupTop(won,function(c){return c.hotel;},function(){return 1;}).map(function(r){return {k:r.k,v:r.v,fmt:r.v+' ventas'};});
 var funnel=STAGES.map(function(s){var n=C.filter(function(c){return stageIndex(c.etapa)>=stageIndex(s.key);}).length;return {k:s.short,v:n,fmt:n};});
 return ''+
 '<div class="view-head"><h1>Reportes</h1><p>Cómo se está moviendo tu negocio en los últimos meses.</p></div>'+
 '<div class="section-title">&#128200; Ventas por mes</div><div class="card">'+barsHTML(ventasPorMes,true)+'</div>'+
 '<div class="section-title">&#127958;&#65039; Ingresos por destino</div><div class="card">'+(porDestino.length?barsHTML(porDestino):'<div class="form-hint">Sin datos todavía.</div>')+'</div>'+
 '<div class="section-title">&#128225; Leads por fuente</div><div class="card">'+(porFuente.length?barsHTML(porFuente):'<div class="form-hint">Sin datos todavía.</div>')+'</div>'+
 '<div class="section-title">&#127976; Hoteles más vendidos</div><div class="card">'+(porHotel.length?barsHTML(porHotel):'<div class="form-hint">Sin datos todavía.</div>')+'</div>'+
 '<div class="section-title">&#128172; Embudo de conversión</div><div class="card">'+barsHTML(funnel)+'</div>';
}

var PRE_WON_STAGES=['Nuevo lead','Contactado','Calificado','Cotización enviada','Seguimiento','Negociación'];
function computeInsights(){
 var C=activos();
 var won=C.filter(function(c){return WON_STAGES.indexOf(c.etapa)!==-1;});
 var overdue=C.filter(function(c){var u=urgencia(c);return u==='vencido'||u==='sinfecha';}).sort(function(a,b){return priorityScore(b)-priorityScore(a);});
 var overdueValue=overdue.reduce(function(s,c){return s+clienteValor(c);},0);

 var staleByStage={};
 C.forEach(function(c){
  if(PRE_WON_STAGES.indexOf(c.etapa)===-1)return;
  var days=c.ultimoContacto?daysDiff(todayDate(),parseISO(c.ultimoContacto)):999;
  if(days>5)staleByStage[c.etapa]=(staleByStage[c.etapa]||0)+1;
 });
 var bottleneckStage=null,bottleneckCount=0;
 Object.keys(staleByStage).forEach(function(k){if(staleByStage[k]>bottleneckCount){bottleneckCount=staleByStage[k];bottleneckStage=k;}});

 function topGroup(list,keyFn,valFn){
  var g={};list.forEach(function(c){var k=keyFn(c);if(!k)return;g[k]=(g[k]||0)+valFn(c);});
  var arr=Object.keys(g).map(function(k){return {k:k,v:g[k]};}).sort(function(a,b){return b.v-a.v;});
  return arr[0]||null;
 }
 var topFuente=topGroup(won,function(c){return c.fuente;},function(c){return c.valorVenta||0;});
 var topDestino=topGroup(won,function(c){return c.destino;},function(c){return c.valorVenta||0;});
 var topHotel=topGroup(won,function(c){return c.hotel;},function(){return 1;});

 var altaProbabilidad=C.filter(function(c){return esListoParaCerrar(c);}).sort(function(a,b){return clienteValor(b)-clienteValor(a);});
 var cotSinSeg=C.filter(function(c){return c.valorCotizado!=null&&WON_STAGES.indexOf(c.etapa)===-1&&(urgencia(c)==='vencido'||urgencia(c)==='sinfecha');});
 var reactivables=state.clientes.filter(function(c){
  if(c.etapa!=='Viaje realizado')return false;
  var d=c.fechaFin?daysDiff(todayDate(),parseISO(c.fechaFin)):0;
  return d>60;
 });
 var referidosSinContactar=C.filter(function(c){return c.fuente==='Referido'&&(c.etapa==='Nuevo lead'||c.etapa==='Contactado');});
 var k=kpis();
 return {overdue:overdue,overdueValue:overdueValue,bottleneckStage:bottleneckStage,bottleneckCount:bottleneckCount,
  topFuente:topFuente,topDestino:topDestino,topHotel:topHotel,altaProbabilidad:altaProbabilidad,
  cotSinSeg:cotSinSeg,reactivables:reactivables,referidosSinContactar:referidosSinContactar,kpis:k,won:won};
}

function buildRecommendations(ins){
 var recs=[];
 if(ins.overdue.length){
  var names=ins.overdue.slice(0,3).map(function(c){return c.nombre;}).join(', ');
  recs.push({score:100+ins.overdueValue/1000,icon:'&#128308;',
   title:ins.overdue.length+' seguimientos vencidos o sin fecha suman '+fmtMoney(ins.overdueValue)+' en ventas potenciales',
   detail:'Contacta hoy mismo a '+names+(ins.overdue.length>3?' y '+(ins.overdue.length-3)+' más':'')+'. Cada día de retraso baja la probabilidad de cierre.'});
 }
 if(ins.bottleneckStage){
  recs.push({score:95,icon:'&#129680;',
   title:'Cuello de botella en la etapa "'+ins.bottleneckStage+'"',
   detail:ins.bottleneckCount+' cliente'+(ins.bottleneckCount>1?'s llevan':' lleva')+' más de 5 días sin contacto ahí. Da seguimiento antes de que se enfríen y se pierdan.'});
 }
 if(ins.altaProbabilidad.length){
  var names2=ins.altaProbabilidad.slice(0,3).map(function(c){return c.nombre;}).join(', ');
  var val2=ins.altaProbabilidad.reduce(function(s,c){return s+clienteValor(c);},0);
  recs.push({score:92,icon:'&#128994;',
   title:ins.altaProbabilidad.length+' cliente'+(ins.altaProbabilidad.length>1?'s están':' está')+' listo'+(ins.altaProbabilidad.length>1?'s':'')+' para cerrar ('+fmtMoney(val2)+')',
   detail:'Prioriza hoy: '+names2+'. Están en negociación o apartado con probabilidad alta de compra.'});
 }
 if(ins.cotSinSeg.length){
  recs.push({score:88,icon:'&#128196;',
   title:ins.cotSinSeg.length+' cotización'+(ins.cotSinSeg.length>1?'es enviadas':' enviada')+' sin seguimiento programado',
   detail:'Nunca debe quedar una cotización sin una próxima fecha. Ábrelas en Seguimientos y reprográmalas ahora.'});
 }
 if(ins.topFuente){
  recs.push({score:70,icon:'&#128200;',
   title:ins.topFuente.k+' es tu mejor fuente de ventas ('+fmtMoney(ins.topFuente.v)+')',
   detail:'Vale la pena invertir más presupuesto o contenido ahí: es el canal con mejor retorno de tu negocio.'});
 }
 if(ins.referidosSinContactar.length){
  recs.push({score:65,icon:'&#127873;',
   title:ins.referidosSinContactar.length+' referido'+(ins.referidosSinContactar.length>1?'s':'')+' sin contactar a tiempo',
   detail:'Los referidos cierran más rápido que un lead frío. Contáctalos primero, antes que a cualquier otro lead nuevo.'});
 }
 if(ins.reactivables.length){
  recs.push({score:55,icon:'&#9992;&#65039;',
   title:ins.reactivables.length+' cliente'+(ins.reactivables.length>1?'s':'')+' que ya viajó hace más de 2 meses sin reactivar',
   detail:'Escríbeles para pedir reseña y proponer su siguiente viaje. Es tu venta más barata de conseguir.'});
 }
 if(ins.topDestino){
  recs.push({score:40,icon:'&#127958;&#65039;',
   title:ins.topDestino.k+' es tu destino más rentable ('+fmtMoney(ins.topDestino.v)+')',
   detail:'Considera crear una promoción o campaña específica para este destino, ya demostró demanda real.'});
 }
 recs.sort(function(a,b){return b.score-a.score;});
 return recs.slice(0,5);
}

function analizarNegocio(){
 openModal(
  '<div class="modal-head"><h2>&#128269; Análisis de tu negocio</h2><button class="icon-btn" onclick="closeModal()">&#10005;</button></div>'+
  '<div class="modal-body" id="analysisBody"><div class="insight-loading"><div class="spinner"></div><div style="font-size:13.5px;color:var(--text-muted);">Analizando tu pipeline y tus clientes&hellip;</div></div></div>'
 );
 setTimeout(renderAnalysisResults,700);
}
function renderAnalysisResults(){
 var el=document.getElementById('analysisBody');
 if(!el)return;
 var ins=computeInsights();
 var recs=buildRecommendations(ins);
 var k=ins.kpis;
 var statsHTML=''+
  '<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:6px;">'+
  '<div class="insight-stat"><b>'+k.conversion.toFixed(1)+'%</b><span>Conversión</span></div>'+
  '<div class="insight-stat"><b>'+fmtMoney(k.ticketProm)+'</b><span>Ticket promedio</span></div>'+
  '<div class="insight-stat"><b>'+ins.won.length+'</b><span>Ventas cerradas</span></div>'+
  '<div class="insight-stat"><b>'+(ins.topDestino?ins.topDestino.k:'&mdash;')+'</b><span>Destino top</span></div>'+
  '</div>';
 var recsHTML=recs.length? recs.map(function(r,i){
   return '<div class="rec-card"><div class="rec-top"><span class="rec-num">'+(i+1)+'</span><span class="rec-title">'+r.icon+' '+r.title+'</span></div>'+
    '<div class="rec-detail">'+r.detail+'</div></div>';
  }).join('') : (state.clientes.length===0?
   '<div class="empty-state"><div class="emo">&#128101;</div>Todavía no hay clientes para analizar.<br>Agrega tus primeros prospectos en CRM.</div>' :
   '<div class="empty-state"><div class="emo">&#127881;</div>Todo está bajo control, no hay focos rojos por ahora.</div>');
 el.innerHTML=statsHTML+'<div class="section-title" style="margin-top:18px;">&#127919; Recomendaciones accionables</div>'+recsHTML;
}

renderApp();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
